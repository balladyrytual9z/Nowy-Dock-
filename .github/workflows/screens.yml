# =====================================================================
# GLOBALNY MECHANIZM TESTOW WIZUALNYCH (2026-11-07, zadanie uzytkownika):
# po kazdym pushu kodu CI odpala emulator Androida 9 (API 28 = wersja
# tabletu ESSGOO), instaluje APK, otwiera kolejne aktywnosci aplikacji
# i robi zrzuty ekranu. Pliki laduja w screens/ w repo ([skip ci]),
# dzieki czemu agent widzi panel/dok WLASNYMI OCZYMI zanim odda build
# i przestaje poprawiac "w ciemno".
# Ograniczenie (uczciwie): emulator ma inna GPU niz Mali-T720 tabletu,
# wiec to weryfikacja ukladu/logiki/renderu Androida 9, a nie dziwactw
# sprzetowych tabletu - te potwierdza tylko screen z urzadzenia.
# =====================================================================
name: Zrzuty ekranu emulatora (testy wizualne)

on:
  push:
    branches: [main]
    paths:
      - 'app/src/main/java/**'
      - 'app/src/main/res/**'
      - '.github/workflows/screens.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: emulator-screens
  cancel-in-progress: true

jobs:
  screens:
    name: Android 9 (API 28) - zrzty ekranow aplikacji
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build debug APK
        shell: bash
        run: |
          set -euo pipefail
          gradle --no-daemon assembleDebug -Pvc="${GITHUB_RUN_NUMBER}" 2>&1 | tail -n 20
          test -f app/build/outputs/apk/debug/app-debug.apk

      - name: Boot Android 9 emulator and screenshot all screens
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 28
          arch: x86_64
          target: default
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -camera-front none
          disable-animations: true
          script: |
            set +e
            PKG=pl.dock.widget
            adb root >/dev/null 2>&1
            adb wait-for-device
            adb install -r app/build/outputs/apk/debug/app-debug.apk
            # uprawnienia runtime/appops - zeby aktywnosci nie padaly na starcie
            adb shell pm grant $PKG android.permission.ACCESS_FINE_LOCATION
            adb shell pm grant $PKG android.permission.ACCESS_COARSE_LOCATION
            adb shell pm grant $PKG android.permission.BLUETOOTH
            adb shell pm grant $PKG android.permission.BLUETOOTH_ADMIN
            adb shell appops set $PKG WRITE_SETTINGS allow
            adb shell appops set $PKG SYSTEM_ALERT_WINDOW allow
            adb shell appops set $PKG PACKAGE_USAGE_STATS allow

            mkdir -p "$GITHUB_WORKSPACE/out"
            shot() {
              NAME="$1"; ACT="$2"
              adb shell am force-stop $PKG >/dev/null 2>&1
              sleep 1
              adb shell am start -n "$PKG/$ACT" >/dev/null 2>&1
              sleep 6
              adb exec-out screencap -p > "$GITHUB_WORKSPACE/out/${NAME}.png"
              echo "== ${NAME}: $(stat -c%s "$GITHUB_WORKSPACE/out/${NAME}.png") bajtow =="
            }

            # ==== GLOBALNA LISTA EKRANOW (dopisuj tu nowe aktywnosci) ====
            shot launcher      .LauncherActivity
            shot connectivity .ConnectivityActivity
            shot apps          .AppsActivity
            shot allapps       .AllAppsActivity
            shot config        .ConfigActivity
            shot nowplaying    .NowPlayingActivity
            shot mediacenter   .MediaCenterActivity
            shot dashboard     .dashboard.CarPlayDashboardActivity
            shot ufo           .ui.UfoClusterActivity
            shot obdterminal   .terminal.ObdTerminalActivity
            shot obdsettings   .settings.ObdSettingsActivity
            shot ereport       .report.EReportActivity
            shot blackbox      .blackbox.BlackBoxActivity
            shot trip          .trip.TripActivity
            shot serwis        .maintenance.MaintenanceActivity
            shot mapy          .maps.NavigatorActivity
            shot zakladki      .maps.bookmark.BookmarksActivity
            shot diag          .DockDiagnosticsActivity
            shot dtc           .diagnostics.DtcManagerActivity
            shot misfire       .diagnostics.MisfireLabActivity
            shot obdskan       .ObdAdapterScanActivity

            # suwaki: ustaw wypelnienie i zrob drugi zrzut centralki
            adb shell am start -n "$PKG/.ConnectivityActivity" >/dev/null 2>&1
            sleep 6
            adb exec-out screencap -p > "$GITHUB_WORKSPACE/out/connectivity2.png"
            ls -la "$GITHUB_WORKSPACE/out"

      - name: Upload screenshots as artifact
        uses: actions/upload-artifact@v4
        with:
          name: emulator-screens-${{ github.run_number }}
          path: out/*.png
          if-no-files-found: error
          retention-days: 30

      - name: Commit screenshots to screens/ [skip ci]
        shell: bash
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          mkdir -p screens
          cp out/*.png screens/
          git add screens/*.png
          if git diff --cached --quiet; then
            echo "Brak zmian - zrzuty identyczne"
          else
            git commit -m "chore: zrzuty ekranu emulatora, run ${{ github.run_number }} [skip ci]"
            git pull --rebase origin main
            git push
          fi
