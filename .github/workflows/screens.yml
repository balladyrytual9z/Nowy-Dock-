# =====================================================================
# GLOBALNY MECHANIZM TESTOW WIZUALNYCH (2026-11-08, zadanie uzytkownika):
# po kazdym pushu kodu CI odpala emulator Androida 9 (API 28 = wersja
# tabletu ESSGOO), instaluje APK, otwiera kolejne aktywnosci aplikacji
# i robi zrzuty ekranu. Pliki laduja w screens/ w repo ([skip ci]),
# dzieki czemu agent widzi panel/dok WLASNYMI OCZYMI zanim odda build.
# Uczciwie: emulator ma inna GPU niz Mali-T720 tabletu - to weryfikacja
# ukladu/logiki na Androidzie 9, a nie dziwactw sprzetowych tabletu.
# Historia: run #1 padl (brak kroku Android SDK przed gradle - naprawione),
# run #2 padl w kroku emulatora (build przeszedl). Zmiany po #2:
# ubuntu-24.04 zamiast ubuntu-latest (Ubuntu 26 ma mlodemu emulatorowi
# problemy), target google_apis zamiast default, -no-snapshot,
# log diagnostyczny emulatora wypisywany do publicznego summary przy padzie.
# =====================================================================
name: Zrzuty ekranu emulatora (testy wizualne)

on:
  push:
    branches: [main]
    paths:
      - 'app/src/main/java/**'
      - 'app/src/main/res/**'
      - '.github/workflows/screens.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: emulator-screens
  cancel-in-progress: true

jobs:
  screens:
    name: Android 9 (API 28) - zrzuty ekranow aplikacji
    runs-on: ubuntu-24.04
    timeout-minutes: 40

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: 'gradle'

      - name: Locate Android SDK and install required packages
        shell: bash
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "$SDK_ROOT/platform-tools" >> "$GITHUB_PATH"
          SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -type f -name sdkmanager -print 2>/dev/null | sort -V | tail -n 1 || true)"
          set +o pipefail
          yes | "$SDKMANAGER" --sdk_root="$SDK_ROOT" --licenses 2>&1 | tee -a "$RUNNER_TEMP/ci.log"
          set -o pipefail
          "$SDKMANAGER" --sdk_root="$SDK_ROOT" --install "platform-tools" "platforms;android-35" "build-tools;35.0.0" 2>&1 | tee -a "$RUNNER_TEMP/ci.log"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
          cache-read-only: false

      - name: Build debug APK
        shell: bash
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE"
          gradle --no-daemon --stacktrace assembleDebug -Pvc="${GITHUB_RUN_NUMBER}" 2>&1 | tee "$RUNNER_TEMP/ci.log"
          test -f app/build/outputs/apk/debug/app-debug.apk

      - name: Boot Android 9 emulator and screenshot all screens
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 28
          arch: x86_64
          target: google_apis
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot -camera-back none -camera-front none
          disable-animations: true
          script: |
            LOG="$RUNNER_TEMP/emulator.log"
            echo "== emulator script start $(date -u +%H:%M:%S) ==" | tee -a "$LOG"
            adb devices | tee -a "$LOG"
            adb shell getprop sys.boot_completed | tee -a "$LOG" || true

            set +e
            PKG=pl.dock.widget
            adb wait-for-device
            adb install -r app/build/outputs/apk/debug/app-debug.apk 2>&1 | tee -a "$LOG"
            adb shell pm grant $PKG android.permission.ACCESS_FINE_LOCATION
            adb shell pm grant $PKG android.permission.ACCESS_COARSE_LOCATION
            adb shell appops set $PKG WRITE_SETTINGS allow
            adb shell appops set $PKG SYSTEM_ALERT_WINDOW allow
            adb shell appops set $PKG PACKAGE_USAGE_STATS allow

            mkdir -p "$GITHUB_WORKSPACE/out"
            shot() {
              NAME="$1"; ACT="$2"
              adb shell am force-stop $PKG >/dev/null 2>&1
              sleep 1
              adb shell am start -n "$PKG/$ACT" 2>&1 | tail -n 2 | tee -a "$LOG"
              sleep 6
              adb exec-out screencap -p > "$GITHUB_WORKSPACE/out/${NAME}.png"
              echo "== ${NAME}: $(stat -c%s "$GITHUB_WORKSPACE/out/${NAME}.png") bajtow ==" | tee -a "$LOG"
            }

            # ==== GLOBALNA LISTA EKRANOW (nazwy sprawdzone z AndroidManifest.xml;
            # ==== nowe aktywnosci dopisuj tu po dodaniu ich do manifestu) ====
            shot launcher      .LauncherActivity
            shot connectivity  .ConnectivityActivity
            shot apps          .AppsActivity
            shot allapps       .AllAppsActivity
            shot config        .ConfigActivity
            shot nowplaying    .NowPlayingActivity
            shot mediacenter   .MediaCenterActivity
            shot dashboard     .dashboard.CarPlayDashboardActivity
            shot ufo           .ui.UfoClusterActivity
            shot obdterminal   .terminal.ObdTerminalActivity
            shot obdsettings   .settings.ObdSettingsActivity
            shot ereport       .report.EReportActivity
            shot blackbox      .blackbox.BlackBoxActivity
            shot trip          .trip.TripActivity
            shot serwis        .maintenance.MaintenanceActivity
            shot mapy          .maps.NavigatorActivity
            shot zakladki      .maps.bookmark.BookmarksActivity
            shot mapdownload   .maps.MapDownloadActivity
            shot diag          .DockDiagnosticsActivity
            shot dtc           .diagnostics.DtcManagerActivity
            shot misfire       .diagnostics.MisfireLabActivity
            shot voltdiag      .VoltDiagActivity
            shot obdskan       .ObdAdapterScanActivity

            # drugi zrzut centralki (pauza na ewentualne animacje wejscia)
            adb shell am start -n "$PKG/.ConnectivityActivity" >/dev/null 2>&1
            sleep 6
            adb exec-out screencap -p > "$GITHUB_WORKSPACE/out/connectivity2.png"

            # sanity check: zrzoty centralki nie moga byc mikroskopijne
            OK=0
            for f in "$GITHUB_WORKSPACE/out"/*.png; do
              [ "$(stat -c%s "$f")" -gt 8000 ] && OK=$((OK+1))
            done
            echo "== zrzutow >8KB: $OK ==" | tee -a "$LOG"
            if [ "$OK" -lt 3 ]; then
              echo "== diagnoza: zrzoty puste, zrzucam okno foreground ==" | tee -a "$LOG"
              adb shell dumpsys window 2>/dev/null | grep -E 'mCurrentFocus|mFocusedApp' | tee -a "$LOG"
              adb shell dumpsys activity activities 2>/dev/null | grep -E 'ResumedActivity|topResumed' | head -n 4 | tee -a "$LOG"
              adb logcat -d -t 200 2>/dev/null | grep -iE 'dock|fatal|crash' | tail -n 40 | tee -a "$LOG"
              exit 1
            fi
            ls -la "$GITHUB_WORKSPACE/out"

      - name: Upload screenshots as artifact
        uses: actions/upload-artifact@v4
        with:
          name: emulator-screens-${{ github.run_number }}
          path: out/*.png
          if-no-files-found: error
          retention-days: 30

      - name: Commit screenshots to screens/ [skip ci]
        shell: bash
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          mkdir -p screens
          cp out/*.png screens/
          git add screens/*.png
          if git diff --cached --quiet; then
            echo "Brak zmian - zrzuty identyczne"
          else
            git commit -m "chore: zrzuty ekranu emulatora, run ${{ github.run_number }} [skip ci]"
            git pull --rebase origin main
            git push
          fi

      # Ogony logow do PUBLICZNEGO podsumowania runa (logi krokow wymagaja
      # logowania, summary nie) - zeby agent widzial powod padu bez konta.
      - name: Dump error summary on failure
        if: failure()
        shell: bash
        run: |
          {
            echo "### Blad testow wizualnych - log emulatora"
            echo '```'
            cat "$RUNNER_TEMP/emulator.log" 2>/dev/null || echo "(brak emulator.log - padla faza bootowania emulatora albo build)"
            echo '```'
            echo "### Ogon logu builda"
            echo '```'
            tail -n 40 "$RUNNER_TEMP/ci.log" 2>/dev/null || echo "(brak ci.log)"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
