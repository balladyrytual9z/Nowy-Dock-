name: Build and publish CarPlay Launcher

on:
  push:
    branches:
      - '**'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: carplay-launcher-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-release:
    name: Build signed Android APK and publish GitHub Release
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Stabilny keystore podpisu: bez tego kazdy build dostaje inny
      # (ephemeral) klucz debug i tablet wymaga odinstalowania starej
      # aplikacji przed instalacja aktualizacji. Keystore jest generowany
      # RAZ, commitowany do repo [skip ci] i uzywany we wszystkich
      # kolejnych buildach - instalacja nadpisuje stara wersje (update).
      - name: Ensure stable signing keystore
        shell: bash
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE"
          if [ ! -f app/dock-debug.p12 ]; then
            echo "Brak keystore - generuje stabilny klucz podpisu i commituje [skip ci]"
            keytool -genkeypair -v \
              -keystore app/dock-debug.p12 \
              -storetype PKCS12 \
              -storepass dockdock \
              -alias dock \
              -keypass dockdock \
              -keyalg RSA -keysize 2048 -validity 36500 \
              -dname "CN=Dock Launcher, OU=Dock, O=Dock, L=Warsaw, C=PL"
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add app/dock-debug.p12
            git commit -m "chore: stabilny keystore podpisu APK (update bez odinstalowania) [skip ci]"
            git push origin HEAD:main
          else
            echo "Keystore app/dock-debug.p12 obecny - podpis stabilny"
          fi

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Locate Android SDK and install required packages
        shell: bash
        run: |
          set -euo pipefail

          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          if [ ! -d "$SDK_ROOT" ]; then
            echo "ERROR: Android SDK directory not found: $SDK_ROOT"
            exit 1
          fi

          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "$SDK_ROOT/platform-tools" >> "$GITHUB_PATH"

          SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -type f -name sdkmanager -print 2>/dev/null | sort -V | tail -n 1 || true)"
          if [ -z "$SDKMANAGER" ]; then
            echo "ERROR: sdkmanager not found under $SDK_ROOT/cmdline-tools."
            exit 1
          fi

          set +o pipefail
          yes | "$SDKMANAGER" --sdk_root="$SDK_ROOT" --licenses 2>&1 | tee -a "$RUNNER_TEMP/ci.log"
          set -o pipefail

          "$SDKMANAGER" --sdk_root="$SDK_ROOT" --install \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0" 2>&1 | tee -a "$RUNNER_TEMP/ci.log"

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      # versionCode = numer runa CI -> zawsze rosnacy, instalator Androida
      # traktuje APK jako aktualizacje (a nie downgrade/reinstall).
      - name: Build Android APK (Debug, stable signing, auto versionCode)
        env:
          GITHUB_RUN_NUMBER: ${{ github.run_number }}
        shell: bash
        run: |
          set -euo pipefail

          PROJECT_DIR="$GITHUB_WORKSPACE"
          if [ ! -f "$PROJECT_DIR/settings.gradle" ]; then
            echo "ERROR: settings.gradle not found in $PROJECT_DIR" | tee -a "$RUNNER_TEMP/ci.log"
            exit 1
          fi

          cd "$PROJECT_DIR"
          echo "gradle version:" | tee -a "$RUNNER_TEMP/ci.log"
          gradle --version 2>&1 | tee -a "$RUNNER_TEMP/ci.log" || true
          gradle --no-daemon --stacktrace clean assembleDebug -Pvc="${GITHUB_RUN_NUMBER}" 2>&1 | tee "$RUNNER_TEMP/build.log"
          cp "$RUNNER_TEMP/build.log" "$RUNNER_TEMP/ci.log.bak" || true

          APK="app/build/outputs/apk/debug/app-debug.apk"
          if [ ! -s "$APK" ]; then
            echo "ERROR: Debug APK was not generated: $APK"
            exit 1
          fi

          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose "$APK" || true

          mkdir -p "$RUNNER_TEMP/release-assets"
          cp "$APK" "$RUNNER_TEMP/release-assets/CarPlay-Launcher-v1.0.${GITHUB_RUN_NUMBER}.apk"
          (
            cd "$RUNNER_TEMP/release-assets"
            sha256sum "CarPlay-Launcher-v1.0.${GITHUB_RUN_NUMBER}.apk" > SHA256SUMS.txt
          )

      - name: Publish failure log [skip ci]
        if: failure()
        shell: bash
        run: |
          cd "$GITHUB_WORKSPACE"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          {
            echo "# CI failure log (run ${{ github.run_id }})"
            echo; echo '## build.log'; echo
            cat "$RUNNER_TEMP/build.log" 2>/dev/null || echo "(missing)"
            echo; echo '## ci.log'; echo
            cat "$RUNNER_TEMP/ci.log" 2>/dev/null || echo "(missing)"
          } > ci-failure-log.md || true
          git add ci-failure-log.md || true
          git commit -m "CI failure log [skip ci]" || true
          git push origin HEAD:main || true

      - name: Upload APK as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: CarPlay-Launcher-v1.0.${{ github.run_number }}
          path: ${{ runner.temp }}/release-assets/*
          if-no-files-found: error
          retention-days: 90

      - name: Create GitHub Release
        uses: ncipollo/release-action@v1
        with:
          tag: v1.0.${{ github.run_number }}
          name: CarPlay Launcher v1.0.${{ github.run_number }}
          commit: ${{ github.sha }}
          artifacts: "${{ runner.temp }}/release-assets/*"
          token: ${{ secrets.GITHUB_TOKEN }}
          generateReleaseNotes: true
