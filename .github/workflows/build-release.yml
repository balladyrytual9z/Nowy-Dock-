
name: Build and publish CarPlay Launcher

on:
  push:
    branches:
      - '**'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: carplay-launcher-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-release:
    name: Build signed Android APK and publish GitHub Release
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Locate Android SDK and install required packages
        shell: bash
        run: |
          set -euo pipefail

          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          if [ ! -d "$SDK_ROOT" ]; then
            echo "ERROR: Android SDK directory not found: $SDK_ROOT"
            exit 1
          fi

          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "$SDK_ROOT/platform-tools" >> "$GITHUB_PATH"

          SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -type f -name sdkmanager -print 2>/dev/null | sort -V | tail -n 1 || true)"
          if [ -z "$SDKMANAGER" ]; then
            echo "ERROR: sdkmanager not found under $SDK_ROOT/cmdline-tools."
            exit 1
          fi

          set +o pipefail
          yes | "$SDKMANAGER" --sdk_root="$SDK_ROOT" --licenses
          set -o pipefail

          "$SDKMANAGER" --sdk_root="$SDK_ROOT" --install \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      - name: Select project folder or uploaded ZIP
        id: source
        shell: bash
        run: |
          set -euo pipefail

          if [ -f "settings.gradle" ] || [ -f "settings.gradle.kts" ]; then
            PROJECT_DIR="$GITHUB_WORKSPACE"
          else
            ZIP_PATH="$(git diff-tree --no-commit-id --name-only -r "$GITHUB_SHA" -- '*.zip' | head -n 1 || true)"

            if [ -z "$ZIP_PATH" ]; then
              ZIP_PATH="$(find . -maxdepth 3 -type f -name '*.zip' | head -n 1 || true)"
            fi

            if [ -z "$ZIP_PATH" ] || [ ! -f "$ZIP_PATH" ]; then
              echo "ERROR: No source ZIP found."
              exit 1
            fi

            mkdir -p "$RUNNER_TEMP/carplay-launcher-source"
            unzip -q "$ZIP_PATH" -d "$RUNNER_TEMP/carplay-launcher-source"

            SETTINGS_FILE="$(find "$RUNNER_TEMP/carplay-launcher-source" -maxdepth 6 \( -name settings.gradle -o -name settings.gradle.kts \) -type f | head -n 1)"
            PROJECT_DIR="$(dirname "$SETTINGS_FILE")"
          fi

          echo "project_dir=$PROJECT_DIR" >> "$GITHUB_OUTPUT"

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build Android APK (Debug)
        working-directory: ${{ steps.source.outputs.project_dir }}
        env:
          GITHUB_RUN_NUMBER: ${{ github.run_number }}
        shell: bash
        run: |
          set -euo pipefail

          gradle --no-daemon --stacktrace clean assembleDebug

          APK="app/build/outputs/apk/debug/app-debug.apk"
          if [ ! -s "$APK" ]; then
            echo "ERROR: Debug APK was not generated: $APK"
            exit 1
          fi

          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose "$APK"

          mkdir -p "$RUNNER_TEMP/release-assets"
          cp "$APK" "$RUNNER_TEMP/release-assets/CarPlay-Launcher-v1.0.${GITHUB_RUN_NUMBER}.apk"
          (
            cd "$RUNNER_TEMP/release-assets"
            sha256sum "CarPlay-Launcher-v1.0.${GITHUB_RUN_NUMBER}.apk" > SHA256SUMS.txt
          )

      - name: Upload APK as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: CarPlay-Launcher-v1.0.${{ github.run_number }}
          path: ${{ runner.temp }}/release-assets/*
          if-no-files-found: error
          retention-days: 90

      - name: Create GitHub Release
        uses: ncipollo/release-action@v1
        with:
          tag: v1.0.${{ github.run_number }}
          name: CarPlay Launcher v1.0.${{ github.run_number }}
          commit: ${{ github.sha }}
          artifacts: "${{ runner.temp }}/release-assets/*"
          token: ${{ secrets.GITHUB_TOKEN }}
          generateReleaseNotes: true


