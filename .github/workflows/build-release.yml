name: Build and publish CarPlay Launcher

on:
  push:
    branches:
      - 'main' # Release tworzy się TYLKO gdy kod trafi do głównej gałęzi
  pull_request:
    branches:
      - 'main' # Uruchamia się przy Pull Requeście, żeby agent widział błędy
  workflow_dispatch: # Pozwala na ręczne uruchomienie z panelu GitHuba

permissions:
  contents: write

concurrency:
  group: carplay-launcher-release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-release:
    name: Build, Test and publish Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Ensure stable signing keystore
        shell: bash
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE"
          if [ ! -f app/dock-debug.p12 ]; then
            echo "Brak keystore - generuje stabilny klucz podpisu i commituje [skip ci]"
            keytool -genkeypair -v \
              -keystore app/dock-debug.p12 \
              -storetype PKCS12 \
              -storepass dockdock \
              -alias dock \
              -keypass dockdock \
              -keyalg RSA -keysize 2048 -validity 36500 \
              -dname "CN=Dock Launcher, OU=Dock, O=Dock, L=Warsaw, C=PL"
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add app/dock-debug.p12
            git commit -m "chore: stabilny keystore podpisu APK (update bez odinstalowania) [skip ci]"
            git push origin HEAD:main
          else
            echo "Keystore app/dock-debug.p12 obecny - podpis stabilny"
          fi

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Locate Android SDK and install required packages
        shell: bash
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "$SDK_ROOT/platform-tools" >> "$GITHUB_PATH"
          SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -type f -name sdkmanager -print 2>/dev/null | sort -V | tail -n 1 || true)"
          set +o pipefail
          yes | "$SDKMANAGER" --sdk_root="$SDK_ROOT" --licenses 2>&1 | tee -a "$RUNNER_TEMP/ci.log"
          set -o pipefail
          "$SDKMANAGER" --sdk_root="$SDK_ROOT" --install "platform-tools" "platforms;android-35" "build-tools;35.0.0" 2>&1 | tee -a "$RUNNER_TEMP/ci.log"

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      # NOWY KROK: Uruchomienie testów jednostkowych
      - name: Run Unit Tests
        shell: bash
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE"
          echo "Uruchamianie testów..." | tee -a "$RUNNER_TEMP/ci.log"
          gradle --no-daemon test 2>&1 | tee -a "$RUNNER_TEMP/ci.log"

      - name: Build Android APK (Debug, stable signing, auto versionCode)
        env:
          GITHUB_RUN_NUMBER: ${{ github.run_number }}
        shell: bash
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE"
          gradle --no-daemon --stacktrace clean assembleDebug -Pvc="${GITHUB_RUN_NUMBER}" 2>&1 | tee -a "$RUNNER_TEMP/ci.log"
          APK="app/build/outputs/apk/debug/app-debug.apk"
          mkdir -p "$RUNNER_TEMP/release-assets"
          cp "$APK" "$RUNNER_TEMP/release-assets/CarPlay-Launcher-v1.0.${GITHUB_RUN_NUMBER}.apk"
          (cd "$RUNNER_TEMP/release-assets" && sha256sum *.apk > SHA256SUMS.txt)

      - name: Upload APK as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: CarPlay-Launcher-v1.0.${{ github.run_number }}
          path: ${{ runner.temp }}/release-assets/*
          if-no-files-found: error
          retention-days: 90

      # Release tworzy się TYLKO przy pushu do main (nie przy Pull Requestach)
      - name: Create GitHub Release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: ncipollo/release-action@v1
        with:
          tag: v1.0.${{ github.run_number }}
          name: CarPlay Launcher v1.0.${{ github.run_number }}
          commit: ${{ github.sha }}
          artifacts: "${{ runner.temp }}/release-assets/*"
          token: ${{ secrets.GITHUB_TOKEN }}
          generateReleaseNotes: true
