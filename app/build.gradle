plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'pl.dock.widget'
    compileSdk 35

    def debugKeystore = file('dock-debug.p12')
    if (debugKeystore.exists()) {
        signingConfigs {
            debug {
                storeFile debugKeystore
                storePassword 'dockdock'
                keyAlias 'dock'
                keyPassword 'dockdock'
                storeType 'pkcs12'
            }
        }
    }

    defaultConfig {
        applicationId 'pl.dock.widget'
        minSdk 26
        targetSdk 28

        // versionCode przekazywany z CI (-Pvc=<run_number>) - zawsze rosnacy,
        // dzieki czemu instalacja APK na tablecie jest UPDATEM, a nie
        // wymagajacym odinstalowania reinstallem. Fallback 15 dla lokalnych
        // buildow.
        def vc = (project.hasProperty('vc') ? project.property('vc') : '15') as Integer
        versionCode vc
        versionName "1.0.${vc}-obd"

        ndk {
            abiFilters 'armeabi-v7a', 'arm64-v8a', 'x86', 'x86_64'
        }
    }

    buildTypes {
        debug {
            if (debugKeystore.exists()) {
                signingConfig signingConfigs.debug
            }
            minifyEnabled false
        }
        release {
            minifyEnabled false
            if (debugKeystore.exists()) {
                signingConfig signingConfigs.debug
            }
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    kotlinOptions {
        jvmTarget = '1.8'
    }

    packaging {
        resources {
            excludes += ['META-INF/INDEX.LIST', 'META-INF/DEPENDENCIES']
        }
    }

    lint {
        abortOnError false
        checkReleaseBuilds false
    }
}

dependencies {
    // pure Android framework - no AndroidX for UI
    // Kotlin + Coroutines for OBD transport / session (MVVM isolation)
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.7.3'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-core:1.7.3'
}
