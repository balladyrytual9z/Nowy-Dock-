plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'pl.dock.widget'
    compileSdk 35

    def debugKeystore = file('dock-debug.p12')
    if (debugKeystore.exists()) {
        signingConfigs {
            debug {
                storeFile debugKeystore
                storePassword 'dockdock'
                keyAlias 'dock'
                keyPassword 'dockdock'
                storeType 'pkcs12'
            }
        }
    }

    defaultConfig {
        applicationId 'pl.dock.widget'
        minSdk 26
        targetSdk 28

        // versionCode przekazywany z CI (-Pvc=<run_number>) - zawsze rosnacy,
        // dzieki czemu instalacja APK na tablecie jest UPDATEM, a nie
        // wymagajacym odinstalowania reinstallem. Fallback 15 dla lokalnych
        // buildow.
        def vc = (project.hasProperty('vc') ? project.property('vc') : '15') as Integer
        versionCode vc
        versionName "1.0.${vc}-obd"

        // Head unit ESSGOO 9" jest 32-bitowy: kernel armv7l, ABI
        // armeabi-v7a/armeabi. Biblioteki natywne MUSZA byc ARMv7.
        // arm64-v8a/x86/x86_64 na tym sprzecie nie wstana, a tylko
        // puchna w APK - stad zawężenie do jednej architektury.
        // Uwaga: gdy dojdzie AAR z libkami, sprawdz czy ma
        // lib/armeabi-v7a/ (patrz AGENTS.md, sekcja 2a).
        ndk {
            abiFilters 'armeabi-v7a'
        }
    }

    buildTypes {
        debug {
            if (debugKeystore.exists()) {
                signingConfig signingConfigs.debug
            }
            minifyEnabled false
        }
        release {
            minifyEnabled false
            if (debugKeystore.exists()) {
                signingConfig signingConfigs.debug
            }
        }
    }

    // Java 17 + desugaring: wymog Organic Maps SDK (natywny renderer,
    // wyszukiwarka offline i routing). CI uzywa JDK 17 (temurin) - patrz
    // .github/workflows/build-release.yml.
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
        // SDK OM jest budowane z desugaringiem - host musi miec to samo,
        // inaczej klasy z AAR nie wystartuja na API 26.
        coreLibraryDesugaringEnabled true
    }

    kotlinOptions {
        jvmTarget = '17'
    }

    // Natywny silnik map czyta .mwm, fonty i packed_polygons.bin z APK
    // losowym dostepem - spakowane (deflate) sa nieczytelne i mapa pada.
    // PNG sa juz skompresowane, wiec zapis 1:1 tylko oszczedza czas.
    androidResources {
        noCompress.addAll(['png', 'mwm', 'ttf', 'packed_polygons.bin'])
    }

    packaging {
        resources {
            excludes += ['META-INF/INDEX.LIST', 'META-INF/DEPENDENCIES']
        }
    }

    lint {
        abortOnError false
        checkReleaseBuilds false
    }

    testOptions {
        // Testy JVM moga ladowac klasy ze statycznymi polami Androida
        // (np. PanelTool ma statyczny Paint) - stub zwraca wartosci
        // domyslne zamiast rzucac wyjatek "not mocked".
        unitTests {
            returnDefaultValues = true
        }
    }
}

dependencies {
    // pure Android framework - no AndroidX for UI
    // Kotlin + Coroutines for OBD transport / session (MVVM isolation)
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.7.3'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-core:1.7.3'

    // Mapy offline (OpenStreetMap) - silnik kafli osmdroid. Czysty AAR,
    // bez zaleznosci i bez AndroidX, wiec nie ciagnie nic dodatkowego.
    // Mapy dzialaja bez internetu (kafle z pamieci), a przy podlaczonym
    // internecie dokladaja/odswiezaja obszar.
    implementation 'org.osmdroid:osmdroid-android:6.1.18'

    // Wymagane przez Organic Maps SDK (Java 17 -> API 26). Artefakt lezy
    // w repozytorium Google (google() w settings.gradle), nie na Central.
    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.1.5'

    // Testy jednostkowe (JVM) - parser ELM327 i logika czysta, bez Androida.
    testImplementation 'junit:junit:4.13.2'
}
